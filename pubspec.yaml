name: snowfall_or_anythings
description: "Make snow, rain, hearts, leaves, Christmas items or any widget fall over your Flutter app. Mix up to 5 elements with custom percentages."
version: 0.0.9
homepage: https://github.com/ValdirGiorgi/snowfall_or_anythings
repository: https://github.com/ValdirGiorgi/snowfall_or_anythings

screenshots:
  # The first screenshot is the main image on the pub.dev package page.
  - description: Snowfall or Anythings logo.
    path: assets/logos/snowfall_or_anythings.png
  - description: Snowflakes, stars, Santa, Christmas trees and gifts falling together.
    path: screenshots/christmas_mix.gif

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - snowfall
  - particles
  - animation
  - christmas
  - effects
